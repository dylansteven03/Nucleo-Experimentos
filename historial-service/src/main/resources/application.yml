server:
  port: 8083

spring:
  application:
    name: historial-service
  datasource:
    url: jdbc:postgresql://${HISTORIAL_DB_HOST:localhost}:${HISTORIAL_DB_PORT:5434}/${POSTGRES_HISTORIAL_DB:historial}
    username: ${POSTGRES_HISTORIAL_USER:historial}
    password: ${POSTGRES_HISTORIAL_PASSWORD:cambiar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # solo desarrollo; en producción se cambia por migraciones

nucleo:
  security:
    # Debe coincidir exactamente con el claim "iss" del token que emite Keycloak.
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/numerico-realm}
    jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8180/realms/numerico-realm/protocol/openid-connect/certs}
    audience: numerico-api

management:
  endpoints:
    web:
      exposure:
        include: health
