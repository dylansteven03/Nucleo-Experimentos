# Sistema COMPLETO en Docker: Keycloak, dos bases de datos, tres servicios Java, calculo-service (C por JNA)
# y el api-gateway como puerta única.
#
# Uso:   docker compose up -d --build
# Parar: docker compose down          (agregar -v borra los datos)
#
# Antes de usarlo, apague docker-compose.dev.yml y cierre los servicios que tenga corriendo en IntelliJ:
# usan los mismos puertos (8080 a 8083, 8180).
#
# Detalle de Keycloak: el token lo pide el usuario por http://localhost:8180, así que su emisor ("iss") es
# http://localhost:8180/realms/numerico-realm. Pero DENTRO de Docker, localhost no es Keycloak: cada servicio
# descarga las claves públicas desde http://keycloak:8080. Por eso emisor y JWKS son dos valores distintos.
x-keycloak: &keycloak
  KEYCLOAK_ISSUER: http://localhost:8180/realms/numerico-realm
  KEYCLOAK_JWKS: http://keycloak:8080/realms/numerico-realm/protocol/openid-connect/certs

services:
  postgres-funcion:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_FUNCION_DB:-funciones}
      POSTGRES_USER: ${POSTGRES_FUNCION_USER:-funcion}
      POSTGRES_PASSWORD: ${POSTGRES_FUNCION_PASSWORD:-cambiar}
    volumes:
      - funcion-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-historial:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_HISTORIAL_DB:-historial}
      POSTGRES_USER: ${POSTGRES_HISTORIAL_USER:-historial}
      POSTGRES_PASSWORD: ${POSTGRES_HISTORIAL_PASSWORD:-cambiar}
    volumes:
      - historial-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-cambiar}
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/numerico-realm.json:/opt/keycloak/data/import/numerico-realm.json:ro

  funcion-service:
    build:
      context: .
      dockerfile: funcion-service/Dockerfile
    environment:
      <<: *keycloak
      FUNCION_DB_HOST: postgres-funcion
      FUNCION_DB_PORT: 5432
      POSTGRES_FUNCION_DB: ${POSTGRES_FUNCION_DB:-funciones}
      POSTGRES_FUNCION_USER: ${POSTGRES_FUNCION_USER:-funcion}
      POSTGRES_FUNCION_PASSWORD: ${POSTGRES_FUNCION_PASSWORD:-cambiar}
    depends_on:
      postgres-funcion:
        condition: service_healthy
    ports:
      - "8081:8081"

  historial-service:
    build:
      context: .
      dockerfile: historial-service/Dockerfile
    environment:
      <<: *keycloak
      HISTORIAL_DB_HOST: postgres-historial
      HISTORIAL_DB_PORT: 5432
      POSTGRES_HISTORIAL_DB: ${POSTGRES_HISTORIAL_DB:-historial}
      POSTGRES_HISTORIAL_USER: ${POSTGRES_HISTORIAL_USER:-historial}
      POSTGRES_HISTORIAL_PASSWORD: ${POSTGRES_HISTORIAL_PASSWORD:-cambiar}
    depends_on:
      postgres-historial:
        condition: service_healthy
    ports:
      - "8083:8083"

  calculo-service:
    build:
      context: .
      dockerfile: calculo-service/Dockerfile
    environment:
      NUCLEO_SECURITY_ISSUER: http://localhost:8180/realms/numerico-realm
      NUCLEO_SECURITY_JWK_SET_URI: http://keycloak:8080/realms/numerico-realm/protocol/openid-connect/certs
    ports:
      - "8082:8082"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      <<: *keycloak
      FUNCION_URL: http://funcion-service:8081
      CALCULO_URL: http://calculo-service:8082
      HISTORIAL_URL: http://historial-service:8083
    depends_on:
      - funcion-service
      - calculo-service
      - historial-service
    ports:
      - "8080:8080"

volumes:
  funcion-data:
  historial-data:
