server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los archivos con hash en el nombre no cambian nunca: se pueden guardar mucho tiempo.
    location ~* \.(js|css|ico|svg|png|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicación de una sola página: cualquier ruta (/funciones, /ejecutar...) devuelve index.html.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
